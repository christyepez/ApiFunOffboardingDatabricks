trigger:
  branches:
    include: [ main ]

pr:
  branches:
    include: [ main ]

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release

steps:
- task: UseDotNet@2
  displayName: Use .NET 10 SDK
  inputs:
    packageType: sdk
    version: '10.x'

- script: dotnet restore IdbInvest.Offboarding.Databricks.Facade.sln
  displayName: Restore

- script: dotnet build IdbInvest.Offboarding.Databricks.Facade.sln --configuration $(buildConfiguration) --no-restore --warnaserror
  displayName: Build Release

- script: |
    dotnet test IdbInvest.Offboarding.Databricks.Facade.sln \
      --configuration $(buildConfiguration) \
      --no-build \
      --collect:"XPlat Code Coverage" \
      --logger:"trx;LogFileName=unit-tests.trx"
  displayName: Unit tests with coverage

- task: PublishTestResults@2
  displayName: Publish unit test results
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '**/unit-tests.trx'
    searchFolder: '$(Agent.TempDirectory)'
    failTaskOnFailedTests: true

- task: PublishCodeCoverageResults@2
  displayName: Publish code coverage
  condition: succeededOrFailed()
  inputs:
    summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'

- script: |
    node -e "JSON.parse(require('fs').readFileSync('src/IdbInvest.Offboarding.Databricks.Facade.Functions/resource-definitions.json','utf8')); console.log('Resource definitions JSON: OK')"
    node -e "JSON.parse(require('fs').readFileSync('postman/IDBInvest-Offboarding-Databricks-Facade.postman_collection.json','utf8')); console.log('Postman collection JSON: OK')"
    node -e "JSON.parse(require('fs').readFileSync('postman/local.postman_environment.json','utf8')); console.log('Postman environment JSON: OK')"
  displayName: Validate JSON assets

- script: |
    npx --yes @redocly/cli lint api/openapi.yaml
    python - <<'PY'
    import xml.etree.ElementTree as ET
    ET.parse('deploy/apim/inbound-policy.xml')
    print('APIM policy XML: OK')
    PY
  displayName: Validate OpenAPI and APIM

- script: |
    az bicep install
    az bicep build --file deploy/infra/main.bicep
    for f in deploy/infra/parameters/*.bicepparam; do
      az bicep build-params --file "$f" --stdout >/dev/null
      echo "$f: OK"
    done
  displayName: Validate Bicep infrastructure

- script: dotnet list IdbInvest.Offboarding.Databricks.Facade.sln package --vulnerable --include-transitive
  displayName: Audit vulnerable packages

- script: dotnet publish src/IdbInvest.Offboarding.Databricks.Facade.Functions/IdbInvest.Offboarding.Databricks.Facade.Functions.csproj -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/function
  displayName: Publish Function

- task: ArchiveFiles@2
  displayName: Archive Function package
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/function'
    includeRootFolder: false
    archiveFile: '$(Build.ArtifactStagingDirectory)/offboarding-function.zip'

- publish: '$(Build.ArtifactStagingDirectory)/offboarding-function.zip'
  displayName: Publish Function artifact
  artifact: function-package
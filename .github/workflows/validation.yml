name: Offboarding Validation

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IdbInvest.Offboarding.Databricks.Facade.sln

      - name: Build Release
        run: dotnet build IdbInvest.Offboarding.Databricks.Facade.sln -c Release --no-restore --warnaserror

      - name: Test
        run: dotnet test IdbInvest.Offboarding.Databricks.Facade.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Validate JSON assets
        run: |
          node -e "JSON.parse(require('fs').readFileSync('src/IdbInvest.Offboarding.Databricks.Facade.Functions/resource-definitions.json','utf8')); console.log('resource-definitions.json: OK')"
          node -e "JSON.parse(require('fs').readFileSync('postman/IDBInvest-Offboarding-Databricks-Facade.postman_collection.json','utf8')); console.log('Postman collection: OK')"
          node -e "JSON.parse(require('fs').readFileSync('postman/local.postman_environment.json','utf8')); console.log('Postman environment: OK')"

      - name: Validate OpenAPI and APIM XML
        run: |
          npx --yes @redocly/cli lint api/openapi.yaml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('deploy/apim/inbound-policy.xml')
          print('APIM policy XML: OK')
          PY

      - name: Validate Bicep infrastructure
        uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep build --file deploy/infra/main.bicep
            for f in deploy/infra/parameters/*.bicepparam; do
              az bicep build-params --file "$f" --stdout >/dev/null
              echo "$f: OK"
            done

      - name: Audit vulnerable packages
        run: dotnet list IdbInvest.Offboarding.Databricks.Facade.sln package --vulnerable --include-transitive

      - name: Publish Function package
        run: dotnet publish src/IdbInvest.Offboarding.Databricks.Facade.Functions/IdbInvest.Offboarding.Databricks.Facade.Functions.csproj -c Release -o artifacts/function

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          if-no-files-found: ignore

      - name: Upload Function package
        uses: actions/upload-artifact@v4
        with:
          name: function-package
          path: artifacts/function/**
          if-no-files-found: error
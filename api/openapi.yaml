openapi: 3.0.3
info:
  title: Offboarding Data Exposure API
  version: 1.0.0
  license: { name: Proprietary }
  description: Read-only governed API that exposes offboarding data from approved Databricks Gold views. Consumer systems own their internal deprovisioning processes.
security:
  - bearerAuth: []
servers:
  - url: https://{apim-host}/offboarding/v1
    variables:
      apim-host: { default: api.example.com }
paths:
  /{resource}:
    get:
      summary: Query an exposed offboarding resource
      operationId: queryResource
      parameters:
        - { name: resource, in: path, required: true, schema: { type: string } }
        - { name: fields, in: query, schema: { type: string }, description: Comma-separated selectable public field names. }
        - { name: filter, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true, description: "field:operator:value. Can be repeated; semicolon separation is also accepted." }
        - { name: sort, in: query, schema: { type: string }, description: Comma-separated sortable fields; prefix with - for descending. }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: includeTotal, in: query, schema: { type: boolean, default: false } }
        - { name: x-correlation-id, in: header, schema: { type: string, maxLength: 128 } }
      responses:
        '200': { description: Query result }
        '400': { description: Invalid query }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Resource not exposed }
        '429': { description: Rate limited }
        '503': { description: Databricks unavailable }
  /resources/{resource}/metadata:
    get:
      summary: Get logical contract metadata for a resource
      operationId: resourceMetadata
      parameters:
        - { name: resource, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Allowed public fields and capabilities }
        '404': { description: Resource not exposed }
  /health:
    get:
      summary: Check API and Databricks dependency health
      operationId: health
      responses:
        '200': { description: Healthy }
        '401': { description: Unauthorized }
        '503': { description: Dependency degraded }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
